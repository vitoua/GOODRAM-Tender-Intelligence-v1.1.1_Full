{% extends 'base.html' %}{% block c %}<h1>{{t.analytics}}</h1><form class="filters"><select name="country"><option value="">Wszystkie kraje</option>{% for c in countries %}<option {% if c==country %}selected{% endif %}>{{c}}</option>{% endfor %}</select><select name="source"><option value="">Wszystkie źródła</option>{% for s in source_list %}<option {% if s==source %}selected{% endif %}>{{s}}</option>{% endfor %}</select><input type="date" name="date_from" value="{{date_from}}"><input type="date" name="date_to" value="{{date_to}}"><button>Filtruj</button></form><div class="kpis"><div><b>{{count}}</b><span>Przetargi</span></div><div><b>{{data.countries|length}}</b><span>Kraje</span></div><div><b>{{data.sources|length}}</b><span>Źródła</span></div></div><div class="charts"><article><canvas id="country"></canvas></article><article><canvas id="source"></canvas></article><article><canvas id="cpv"></canvas></article><article><canvas id="days"></canvas></article></div><article><h2>Najwięksi zamawiający</h2>{% for k,v in data.buyers.items() %}<p>{{k}} <b>{{v}}</b></p>{% endfor %}</article>{% endblock %}{% block scripts %}<script>const D={{data|tojson}};function c(id,type,obj){new Chart(document.getElementById(id),{type,data:{labels:Object.keys(obj),datasets:[{data:Object.values(obj),backgroundColor:['#e30613','#111','#777','#b9000b','#e85b63','#444']}]},options:{responsive:true}})}c('country','bar',D.countries);c('source','doughnut',D.sources);c('cpv','bar',D.cpv);c('days','line',D.days);</script>{% endblock %}
